<html lang="en"><head>

<meta name="theme-color" content="#07090D">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Book a call with Jason — AI Go Long</title>
<style>
:root{--bg:#07090D;--card:#121a26;--line:#243040;--ink:#eef2f7;--soft:#9fb0c2;--green:#2EE08A;--green2:#15c773;--accent:#4C8DFF}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
background:radial-gradient(1100px 560px at 50% -12%,#15274a,#07090D 58%) fixed}
.wrap{max-width:470px;margin:0 auto;padding:26px 16px 50px}
.hd{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--green2));display:grid;place-items:center;color:#04110a;font-weight:900;font-size:18px;box-shadow:0 0 28px rgba(46,224,138,.45)}
.hd b{letter-spacing:3px;font-size:14px;color:#cfe6d9}.hd b span{color:var(--green)}
h1{font-size:25px;margin:18px 0 3px;font-weight:800}
.sub{color:var(--soft);font-size:15px;margin:0 0 20px}
.day{margin:20px 0 10px;font-weight:700;font-size:15px;color:#d7e4f1;display:flex;align-items:center;gap:9px}
.day:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:13px 6px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);transition:transform .08s,background .15s}
.t:active{transform:scale(.96)}
.t.sel{background:linear-gradient(135deg,var(--green),var(--green2));color:#04110a;border-color:transparent;box-shadow:0 8px 22px rgba(46,224,138,.3)}
.form{margin-top:24px;background:linear-gradient(180deg,#141d2a,#0f1620);border:1px solid var(--line);border-radius:18px;padding:20px;display:none}
.form.on{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pick{color:var(--green);font-weight:800;font-size:16px;margin-bottom:6px}
.form label{display:block;font-size:12.5px;color:var(--soft);margin:13px 0 5px;letter-spacing:.3px}
.form input,.form textarea{width:100%;background:#0d141d;border:1px solid var(--line);border-radius:11px;padding:13px;color:var(--ink);font-size:16px;outline:0}
.form input:focus,.form textarea:focus{border-color:var(--green)}
.go{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--green),var(--green2));color:#04110a;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(46,224,138,.3)}
.err{color:#ff8b86;font-size:13.5px;margin-top:9px;min-height:1em}
.msg{text-align:center;padding:40px 10px;display:none}
.msg.on{display:block}
.msg .big{font-size:52px}.msg h2{margin:12px 0 6px;font-size:26px}
.foot{text-align:center;color:#6f8198;font-size:12.5px;margin-top:26px}
.foot a{color:var(--green);text-decoration:none}
</style></head>
<body><div class="wrap">

  <label>Phone (optional)</label><input id="phone" type="tel" autocomplete="tel">

  <div class="err" id="err"></div>
  <button class="go" id="go">Confirm my call</button>
</div>
<div class="msg" id="done"><div class="big">✅</div><h2>You're booked!</h2>
  <p class="sub" id="dwhen"></p><p class="sub">Add it to your calendar on the next screen — Jason's invited and will see it. See you then!</p></div>
<div class="foot">Prefer to talk now? <a href="tel:+12052038377">Call (205) 203-8377</a></div>
</div>
