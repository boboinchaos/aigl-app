<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jason Bourbeau">
<link rel="apple-touch-icon" href="../../icons/card-apple-touch.png">
<link rel="icon" href="../../icons/favicon-32.png">
<link rel="manifest" href="show.webmanifest">
<title>Scan to connect — Jason Bourbeau · AI Go Long</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100svh;color:#eef2f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#05070b;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;position:relative}
/* animated aurora background */
body::before,body::after{content:"";position:fixed;inset:-30%;z-index:0}
body::before{background:
  radial-gradient(640px 640px at 20% 18%,rgba(46,224,138,.28),transparent 60%),
  radial-gradient(680px 680px at 82% 86%,rgba(76,141,255,.24),transparent 62%),
  radial-gradient(560px 560px at 88% 12%,rgba(46,224,138,.12),transparent 60%);
  filter:blur(10px);animation:drift 14s ease-in-out infinite alternate}
body::after{background:radial-gradient(1200px 700px at 50% -10%,#10203c,transparent 60%);z-index:0}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}
.stage{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#2EE08A,#15c773);display:grid;place-items:center;
  color:#04110a;font-weight:900;font-size:20px;box-shadow:0 0 34px rgba(46,224,138,.6),inset 0 1px 1px rgba(255,255,255,.45)}
.brand b{letter-spacing:4px;font-size:18px;color:#d6efe3}.brand b span{color:#2EE08A}
.qrbox{position:relative;background:#fff;border-radius:28px;padding:26px;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(46,224,138,.25),0 0 70px rgba(46,224,138,.25);
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(46,224,138,.25),0 0 50px rgba(46,224,138,.18)}
  50%{box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(46,224,138,.45),0 0 90px rgba(46,224,138,.4)}}
.qrbox img{display:block;width:min(74vw,360px);height:auto;aspect-ratio:1}
.cta{text-align:center}
.cta h1{font-size:clamp(24px,6vw,34px);font-weight:800;letter-spacing:.3px}
.cta p{color:#9fb0c2;font-size:clamp(14px,3.6vw,17px);margin-top:6px}
.who{text-align:center;color:#c9d6e4}
.who .n{font-size:clamp(18px,4.6vw,22px);font-weight:700}
.who .r{color:#8aa0b6;font-size:14px;margin-top:2px}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;z-index:1;color:#60738a;font-size:12px}
</style></head>
<body>
<div class="stage">
  <div class="brand"><span class="mark">AI</span><b>AI GO <span>LONG</span></b></div>
  <div class="cta"><h1>Scan to connect</h1><p>Point your camera here — no app needed</p></div>
  <div class="qrbox"><img src="../qr.png" alt="Scan to open Jason's card"></div>
  <div class="who"><div class="n">Jason Bourbeau</div><div class="r">AI Consultant · AI Go Long</div></div>
</div>
<div class="hint">app.aigl.dev/card</div>

</body></html>
