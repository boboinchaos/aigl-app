<script>
// app.aigl.dev: AIGL's own address for the Command Center (Apps Script web app inside).
// Passes ?setup= (one-time link) and ?d= (device sign-in) through, and remembers ?d= so
// the home-screen icon and plain app.aigl.dev keep working.
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzrQC1lxsNo2-ktcnXp-H_SyL2aGbGtlSzI_FcmXdioRfkDYoo-en59SqmC0seaiuGnEg/exec';
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  var setup = q.get('setup') || '', d = q.get('d') || '';
  var KEY = 'aigl_cc_device';
  try {
    if (/^[a-f0-9]{48,96}$/.test(d)) localStorage.setItem(KEY, d);
    else d = localStorage.getItem(KEY) || '';
  } catch (e) {}
  if (/^[a-f0-9]{32}$/.test(setup)) out.set('setup', setup);
  else if (d) out.set('d', d);
  var s = out.toString();
  document.getElementById('app').src = EXEC + (s ? '?' + s : '');
  // keep secrets out of the visible address bar / history
  if (location.search) history.replaceState(null, '', location.pathname);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>

<script>
/*
  NEO VOICE at the top of the page.
  Phones block the microphone inside Google's Apps Script sandbox frame, so the Vapi call lives here.
  The Command Center (inside the frame, NeoVoicePanel.html) talks to this page with postMessage:
    frame -> here: hello, config {publicKey, assistantId, model}, state {screen}, tool-result {id, result, quiet}, wrote
    here -> frame: launcher (ack), tool {id, name, args}, call {live}
  Only messages from Google's Apps Script sandbox frame that sits inside OUR iframe are accepted.
  No secrets here: the Vapi PUBLIC key comes from the app at run time (public keys are meant for browsers).
*/
(function () {
  var SDK = 'https://esm.sh/@vapi-ai/web@2.3.10';
  var SANDBOX = /^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/;
  var V = { cfg: null, src: null, origin: '', Vapi: null, vapi: null, live: false, starting: false, screen: 'Today', pending: {}, seq: 0, partial: {} };
  var app = document.getElementById('app');
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function state(t, kind) { el('nv-state').textContent = t; el('nv-dot').className = kind || ''; }
  function greeting() { var h = new Date().getHours(); return 'Hey Jason, ' + (h < 12 ? 'good morning' : h < 17 ? 'good afternoon' : 'good evening') + '. Where do you want to start?'; }
  function line(role, text, fin) {
    var box = el('nv-lines'), d = V.partial[role];
    if (!d) { d = document.createElement('div'); d.className = role === 'user' ? 'u' : 'a'; box.appendChild(d); }
    d.innerHTML = '<b>' + (role === 'user' ? 'You' : 'Neo') + ':</b> ' + esc(text);
    d.classList.toggle('p', fin === false);
    if (fin === false) V.partial[role] = d; else delete V.partial[role];
    while (box.children.length > 6) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  function toFrame(msg) { if (V.src && V.origin) { msg.aigl = 'nv'; V.src.postMessage(msg, V.origin); } }

  /* ---- bridge: only our own Command Center frame ---- */
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.aigl !== 'nv' || !SANDBOX.test(e.origin)) return;
    // The app's code runs 1-3 frames below our iframe (Google's sandbox frames). Walk up to make sure it's ours.
    var ok = false;
    try { for (var w = e.source, i = 0; w && i < 4 && !ok; i++) { if (w === app.contentWindow) ok = true; else if (w === w.parent) break; else w = w.parent; } } catch (x) { ok = false; }
    if (!ok) return;
    V.src = e.source; V.origin = e.origin;
    if (m.type === 'hello') { toFrame({ type: 'launcher' }); return; }
    if (m.type === 'config' && m.cfg) {
      var first = !V.cfg; V.cfg = m.cfg; el('nv-fab').classList.add('on');
      if (first) { loadSdk().catch(function () {}); showHello(); }
      return;
    }
    if (m.type === 'state') { V.screen = String(m.screen || V.screen).slice(0, 40); return; }
    if (m.type === 'tool-result' && V.pending[m.id]) { var p = V.pending[m.id]; delete V.pending[m.id]; clearTimeout(p.t); p.res(m); return; }
    if (m.type === 'start') { start(); return; }
  });
  function showHello() {
    try { if (sessionStorage.getItem('nv_hello')) return; sessionStorage.setItem('nv_hello', '1'); } catch (x) {}
    el('nv-hi').textContent = greeting().replace(/\. Where.*$/, '');
    el('nv-hello').classList.add('on');
  }

  /* ---- Vapi ---- */
  function loadSdk() {
    if (V.Vapi) return Promise.resolve(V.Vapi);
    return import(SDK).then(function (m) { V.Vapi = m.default && m.default.default ? m.default.default : (m.default || m.Vapi); return V.Vapi; });
  }
  function fail(e) {
    var msg = String((e && e.error && e.error.message) || (e && (e.message || e.errorMsg || e.error)) || e || 'Voice problem');
    if (/\[object/.test(msg)) msg = 'Voice could not connect';
    V.live = V.starting = false; el('nv-fab').classList.remove('live', 'busy');
    el('nv-strip').classList.add('on'); state(msg.slice(0, 90));
    line('assistant', 'Voice did not start: ' + msg.slice(0, 160) + '. You can still record a note on the Neo tab.', true);
  }
  function ended() {
    V.live = V.starting = false;
    var f = el('nv-fab'); f.classList.remove('live', 'busy'); f.style.boxShadow = '';
    state('Call ended');
    toFrame({ type: 'call', live: false });
    setTimeout(function () { if (!V.live) el('nv-strip').classList.remove('on'); }, 2500);
  }
  function wire(v) {
    v.on('call-start', function () { V.live = true; V.starting = false; el('nv-fab').classList.add('live'); el('nv-fab').classList.remove('busy'); state('Listening… just talk'); toFrame({ type: 'call', live: true }); });
    v.on('call-end', ended);
    v.on('speech-start', function () { state('Neo is talking…', 'talk'); });
    v.on('speech-end', function () { if (V.live) state('Listening…'); });
    v.on('volume-level', function (n) { el('nv-fab').style.boxShadow = '0 0 0 ' + Math.round(Math.min(1, n) * 18) + 'px rgba(169,139,255,.35)'; });
    v.on('message', function (m) {
      if (!m) return;
      if (m.type === 'transcript') line(m.role === 'user' ? 'user' : 'assistant', m.transcript, m.transcriptType === 'final');
      else if (m.type === 'tool-calls') tools(m.toolCallList || m.toolCalls || []);
    });
    v.on('error', fail);
  }
  function start() {
    el('nv-hello').classList.remove('on');
    if (V.live || V.starting) return;
    V.starting = true;
    el('nv-fab').classList.add('busy'); el('nv-strip').classList.add('on'); el('nv-lines').innerHTML = ''; state('Connecting…', 'work');
    // Ask for the mic right inside the tap, so the phone shows its prompt and unlocks audio.
    var mic = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? navigator.mediaDevices.getUserMedia({ audio: true }) : Promise.reject(new Error('This browser has no microphone access'));
    try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { var ac = new AC(); ac.resume && ac.resume(); setTimeout(function () { try { ac.close(); } catch (x) {} }, 1500); } } catch (x) {}
    mic.then(function (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      if (!V.cfg) throw new Error('The app is still loading. Try again in a second.');
      if (!V.cfg.publicKey || !V.cfg.assistantId) throw new Error('Voice is not set up yet (VAPI_PUBLIC_KEY / NEO_ASSISTANT_ID)');
      return loadSdk();
    }).then(function (Vapi) {
      if (!V.vapi) { V.vapi = new Vapi(V.cfg.publicKey); wire(V.vapi); }
      var t = new Date();
      return V.vapi.start(V.cfg.assistantId, {
        firstMessage: greeting(), firstMessageMode: 'assistant-speaks-first',
        model: V.cfg.model,
        clientMessages: ['transcript', 'tool-calls', 'speech-update', 'status-update'],
        variableValues: { greeting: greeting(), today: t.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }),
          now: t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), screen: V.screen }
      });
    }).catch(function (e) {
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) e = new Error('Microphone blocked. Allow the mic for app.aigl.dev in your browser settings.');
      fail(e);
    });
  }
  function stop() { if (V.vapi && (V.live || V.starting)) { try { V.vapi.stop(); } catch (x) {} } ended(); }

  /* Tool calls: Vapi hands them to this page; the app in the frame runs them and posts the result back. */
  function say(name, result, speak) {
    if (!V.vapi || !V.live) return;
    var txt = 'TOOL RESULT ' + name + ': ' + JSON.stringify(result);
    try { V.vapi.send({ type: 'add-message', message: { role: 'system', content: txt.slice(0, 12000) }, triggerResponseEnabled: speak !== false }); } catch (x) {}
  }
  function args(tc) { var a = (tc.function && tc.function.arguments) || tc.arguments || {}; if (typeof a === 'string') { try { a = JSON.parse(a || '{}'); } catch (x) { a = {}; } } return a || {}; }
  function tools(list) {
    list.forEach(function (tc) {
      var name = (tc.function && tc.function.name) || tc.name;
      if (!name || name === 'endCall') return;
      var id = 't' + (++V.seq);
      state('Working on it…', 'work');
      new Promise(function (res) {
        V.pending[id] = { res: res, t: setTimeout(function () { delete V.pending[id]; res({ result: { ok: false, say: 'The app took too long on that one. Want me to leave Neo a note instead?' } }); }, 45000) };
        toFrame({ type: 'tool', id: id, name: name, args: args(tc) });
      }).then(function (m) { say(name, m.result, !m.quiet); if (V.live) state('Listening…'); });
    });
  }

  el('nv-fab').onclick = function () { if (V.live || V.starting) stop(); else start(); };
  el('nv-go').onclick = start;
  el('nv-end').onclick = stop;
  el('nv-skip').onclick = function () { el('nv-hello').classList.remove('on'); };
})();
</script>

<script>
(function(){
  var sh=document.getElementById('qa-sheet'),cd=document.getElementById('qa-card'),fr=document.getElementById('qa-card-frame');
  document.getElementById('qa-fab').onclick=function(){sh.classList.add('on')};
  document.getElementById('qa-close').onclick=function(){sh.classList.remove('on')};
  sh.onclick=function(e){if(e.target===sh)sh.classList.remove('on')};
  sh.querySelectorAll('a.qa-tile').forEach(function(a){a.addEventListener('click',function(){sh.classList.remove('on')})});
  document.getElementById('qa-card-open').onclick=function(){if(!fr.src)fr.src='card/';sh.classList.remove('on');cd.classList.add('on')};
  document.getElementById('qa-card-close').onclick=function(){cd.classList.remove('on')};
  var cw=document.getElementById('qa-con'),cf=document.getElementById('qa-con-frame');
  document.getElementById('qa-console').onclick=function(e){e.preventDefault();sh.classList.remove('on');cf.src='console/?t='+Date.now();cw.style.display='block'};
  window.addEventListener('message',function(e){if(e.data==='cc-close'){cw.style.display='none';cf.src='about:blank'}});
