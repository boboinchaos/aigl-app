<a class="back" href="../">&lsaquo; Back to card</a>
<div class="stage">
  <div class="brand"><span class="mark" style="background:url(../avatar.jpg) center/cover;border-radius:50%"></span><b>MIAMI'S <span>HOTTEST</span> RIDES</b></div>
  <div class="cta"><h1>Scan to connect</h1><p>Point your camera here — no app needed</p></div>
  <a href="../" aria-label="Back to James's card"><div class="qrbox"><img src="../qr.png" alt="Scan to open James's card"></div></a>

</div>

  <div class="vorb" id="vorb"></div>
  <div id="vstatus">Connecting…</div>
  <div id="vhint">Speak naturally. Ask about getting your car featured, a shoot or a collab.</div>
  <button id="aigl-hang">End call</button>
</div>
<script type="module">
import Vapi from "https://esm.sh/@vapi-ai/web@2.3.10";
const PUBLIC_KEY = "8126359c-d121-47eb-855d-7167d44e6f88";
const ASSISTANT_ID = "dea2ff86-9283-4ddd-971b-42654b5f7617";
const JG_PROMPT = "You are the friendly AI assistant for James Gault, co-founder of Miami's Hottest Rides in Miami, Florida. Miami's Hottest Rides showcases the best of Miami's car scene: car photography, video and social media marketing, bringing Miami's cars and art to people around the world. It posts on Instagram and TikTok as @miamishottestrides, plus Facebook and YouTube. Help callers with three things: getting their car featured, booking a photo or video shoot, and brand or business collaborations. For any of these, collect their name, what they want (for a feature, the year, make and model of the car), and their Instagram handle or phone number, then tell them James will follow up. Reach James by phone or text at 305-878-2275, email miamishottestrides@gmail.com, or a DM on Instagram at @miamishottestrides. Never quote prices, dates or availability; say James will confirm those. Do not make up facts about James or the company. Keep answers short, upbeat and conversational, with a little Miami energy. If you do not know something, say James can answer it.";
const vapi = new Vapi(PUBLIC_KEY);
const label = document.getElementById('aigl-voice-label');
const panel = document.getElementById('aigl-call');
const orb = document.getElementById('vorb');
const vstatus = document.getElementById('vstatus');
let live = false, starting = false;
document.getElementById('aigl-voice').addEventListener('click', async () => {
  if (starting || live) return;
  starting = true; label.textContent = 'Connecting…';
  panel.classList.add('on'); vstatus.textContent = 'Connecting…';
  try { if (window.aiglTrack) aiglTrack('Lead', {content_name: 'jg-card voice call'}); } catch (x) {}
  try {
    await vapi.start(ASSISTANT_ID, {
      firstMessage: "Hey, what's up! You've reached the AI assistant for James Gault at Miami's Hottest Rides. I can help get your car featured, set up a shoot, or talk collabs. What can I do for you?",
      voice: { provider: "11labs", voiceId: "cgSgspJ2msm6clMCkdW9" }
    });
  } catch (e) {
    vstatus.textContent = 'Could not start (allow microphone?)';
    starting = false; label.textContent = "Talk to James's AI";
  }
});
vapi.on('call-start', () => {
  live = true; starting = false; vstatus.textContent = "You're connected, go ahead"; orb.classList.add('live');
  try { vapi.send({ type: 'add-message', message: { role: 'system', content: "IMPORTANT: For this entire call you are ONLY James Gault's Miami's Hottest Rides assistant. Ignore any other company identity. " + JG_PROMPT }, triggerResponseEnabled: false }); } catch (x) {}
});
vapi.on('speech-start', () => { vstatus.textContent = "James's AI is speaking…"; });
vapi.on('speech-end', () => { if (live) vstatus.textContent = 'Listening…'; });
vapi.on('call-end', () => { live = false; starting = false; panel.classList.remove('on'); orb.classList.remove('live'); label.textContent = "Talk to James's AI"; });
vapi.on('error', () => { vstatus.textContent = 'Call error, try again'; starting = false; label.textContent = "Talk to James's AI"; });
document.getElementById('aigl-hang').addEventListener('click', () => { try { vapi.stop(); } catch (x) {} panel.classList.remove('on'); live=false; starting=false; label.textContent = "Talk to James's AI"; });
</script>
