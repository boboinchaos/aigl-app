<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nate · Knockout">
<title>Nathan Lippincott · Knockout Inspections</title>
<style>
:root{--bg:#0B1520;--card:#101e2c;--line:#22384c;--ink:#eef4fa;--soft:#9fb4c6;--red:#E23A34;--red2:#b5241f;--gold:#F4B63F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#14304a,#0B1520 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-40%;z-index:0;background:radial-gradient(520px 520px at 20% 12%,rgba(226,58,52,.18),transparent 60%),radial-gradient(560px 560px at 82% 88%,rgba(244,182,63,.12),transparent 62%);filter:blur(8px)}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:26px 18px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.card{position:relative;background:linear-gradient(180deg,#122133,#0c1725);border:1px solid rgba(120,160,200,.16);border-radius:24px;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--red),var(--gold),transparent);opacity:.9}
.logo{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:20px}
.mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--red2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 0 26px rgba(226,58,52,.5),inset 0 1px 1px rgba(255,255,255,.3)}
.logo b{font-size:15px;letter-spacing:2px;color:#dfeaf4;text-transform:uppercase}
.logo b span{color:var(--red)}
.name{text-align:center;font-size:29px;font-weight:800;margin:4px 0 2px}
.role{text-align:center;color:var(--soft);font-size:15.5px;margin-bottom:12px}
.tag{text-align:center;color:var(--gold);font-size:13px;line-height:1.5;margin:0 auto 22px;max-width:320px;font-style:italic;letter-spacing:.3px}
.actions{display:grid;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink)}
.btn svg{width:19px;height:19px}
.btn.save{background:#fff;color:#0B1520;border-color:#fff}
.btn.call{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(226,58,52,.3)}
.foot{text-align:center;color:#6f8599;font-size:12.5px;margin-top:22px;line-height:1.9}
.foot a{text-decoration:none}
.qr{margin:22px auto 4px;width:150px;height:150px;background:#fff;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.qr img{width:132px;height:132px}
.qrlabel{text-align:center;color:var(--soft);font-size:12px;margin-top:7px;letter-spacing:.3px}
</style></head>
<body><div class="wrap">
  <div class="card">
    <div class="logo"><span class="mark">KO</span><b>KNOCKOUT <span>INSPECTIONS</span></b></div>
    <div class="name">Nathan Lippincott</div>
    <div class="role">Owner · Knockout Home Inspections</div>
    <div class="tag">Founded on faith. Fortified with integrity. Focused on you.</div>
    <div class="actions">
      <button class="btn save" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Save to contacts</button>
      <a class="btn call" href="tel:+18554636756"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Call (855) GO-FOR-KO</a>
      <a class="btn" href="sms:+12515174558"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Text me</a>
      <a class="btn" href="mailto:nate@goforko.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="m22 6-10 7L2 6"/></svg>Email me</a>
    </div>
    <div class="qr"><img src="qr.png" alt="QR"></div>
    <div class="qrlabel">Scan to save my card</div>
    <div class="foot">
      <a href="tel:+18554636756" style="color:var(--red);font-weight:700">(855) 463-6756</a> &middot; <a href="https://goforko.com" style="color:#cfe0ef">goforko.com</a><br>
      9959 Windmill Rd, Fairhope, AL 36532
    </div>
  </div>
</div>
<script>
document.getElementById('save').addEventListener('click',function(){
  var v=["BEGIN:VCARD","VERSION:3.0","N:Lippincott;Nathan;;;","FN:Nathan Lippincott",
    "ORG:Knockout Home Inspections LLC","TITLE:Owner",
    "TEL;TYPE=WORK,VOICE:+1-855-463-6756",
    "TEL;TYPE=CELL:+1-251-517-4558",
    "EMAIL;TYPE=WORK:nate@goforko.com",
    "URL:https://goforko.com",
    "ADR;TYPE=WORK:;;9959 Windmill Rd;Fairhope;AL;36532;USA",
    "NOTE:Founded on faith. Fortified with integrity. Focused on you.",
    "END:VCARD"].join("\r\n");
  var b=new Blob([v],{type:"text/vcard"});var u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download="Nathan-Lippincott.vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);
});
</script>
</body></html>
