<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nate · Knockout">
<title>Scan to connect — Nathan Lippincott · Knockout Inspections</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100svh;color:#eef4fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#060d15;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;position:relative}
body::before,body::after{content:"";position:fixed;inset:-30%;z-index:0}
body::before{background:
  radial-gradient(640px 640px at 20% 18%,rgba(226,58,52,.30),transparent 60%),
  radial-gradient(680px 680px at 82% 86%,rgba(244,182,63,.16),transparent 62%);
  filter:blur(10px);animation:drift 14s ease-in-out infinite alternate}
body::after{background:radial-gradient(1200px 700px at 50% -10%,#14304a,transparent 60%);z-index:0}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}
.stage{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#E23A34,#b5241f);display:grid;place-items:center;
  color:#fff;font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 0 34px rgba(226,58,52,.6),inset 0 1px 1px rgba(255,255,255,.3)}
.brand b{letter-spacing:2px;font-size:16px;color:#dfeaf4;text-transform:uppercase}.brand b span{color:#E23A34}
.qrbox{position:relative;background:#fff;border-radius:28px;padding:26px;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(226,58,52,.25),0 0 70px rgba(226,58,52,.22);
  animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(226,58,52,.25),0 0 50px rgba(226,58,52,.16)}
  50%{box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(226,58,52,.45),0 0 90px rgba(226,58,52,.4)}}
.qrbox img{display:block;width:min(74vw,360px);height:auto;aspect-ratio:1}
.cta{text-align:center}
.cta h1{font-size:clamp(24px,6vw,34px);font-weight:800;letter-spacing:.3px}
.cta p{color:#9fb4c6;font-size:clamp(14px,3.6vw,17px);margin-top:6px}
.who{text-align:center;color:#cfe0ef}
.who .n{font-size:clamp(18px,4.6vw,22px);font-weight:700}
.who .r{color:#8fa6ba;font-size:14px;margin-top:2px}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;z-index:1;color:#607689;font-size:12px}
</style></head>
<body>
<div class="stage">
  <div class="brand"><span class="mark">KO</span><b>KNOCKOUT <span>INSPECTIONS</span></b></div>
  <div class="cta"><h1>Scan to connect</h1><p>Point your camera here — no app needed</p></div>
  <div class="qrbox"><img src="../qr.png" alt="Scan to open Nathan's card"></div>
  <div class="who"><div class="n">Nathan Lippincott</div><div class="r">Owner · Knockout Home Inspections</div></div>
</div>
<div class="hint">app.aigl.dev/ko-card</div>

</body></html>
